<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Private page</title>
<style>
:root{--bg:#f3f4f2;--panel:#fff;--ink:#1a1f24;--sub:#56606a;--line:#dde1e3;--accent:#c9771a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--panel:#1c2126;--ink:#e9ecee;--sub:#a9b2ba;--line:#2d343a;--accent:#e79a3f;--bad:#f2867d;color-scheme:dark}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:0 16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:12px;width:100%;max-width:340px;box-sizing:border-box}
h1{font-size:18px;margin:0}
input,button{font:inherit;padding:9px 11px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.7;cursor:wait}
#msg{font-size:13px;color:var(--bad);min-height:1em;margin:0}
label{font-size:13px;color:var(--sub)}
[hidden]{display:none!important}
.rem{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.rem input{width:16px;height:16px;padding:0;accent-color:var(--accent)}
</style>
</head>
<body>
<form id="f" autocomplete="off" hidden>
<h1>Private page</h1>
<label for="p">Password</label>
<input id="p" type="password" required>
<label class="rem"><input id="r" type="checkbox" checked> Remember me on this device</label>
<button id="b" type="submit">Open</button>
<p id="msg" role="alert"></p>
</form>

const SAVE='lws07-key';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
function store(op,v){try{if(op==='get')return localStorage.getItem(SAVE);if(op==='set')localStorage.setItem(SAVE,v);if(op==='del')localStorage.removeItem(SAVE);}catch(e){}return null;}
async function openWith(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)));
  document.open();document.write(html);document.close();
  if(store('get')){
    const go=()=>{const a=document.createElement('button');a.type='button';a.textContent='Forget password on this device';
      a.style.cssText='display:block;margin:8px auto 28px;background:none;border:0;color:inherit;opacity:.6;font:13px system-ui,sans-serif;text-decoration:underline;cursor:pointer';
      a.addEventListener('click',()=>{store('del');location.reload();});document.body.appendChild(a);};
    if(document.body)go();else addEventListener('DOMContentLoaded',go);
  }
}
(async()=>{
  const saved=store('get');
  if(saved){
    if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));
    try{await openWith(b64(saved));return;}catch(e){store('del');}
  }
  const f=document.getElementById('f');f.hidden=false;document.getElementById('p').focus();
  f.addEventListener('submit',async e=>{
    e.preventDefault();const btn=document.getElementById('b'),msg=document.getElementById('msg');
    msg.textContent='';btn.disabled=true;btn.textContent='Opening…';
    try{
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value.toLowerCase()),'PBKDF2',false,['deriveKey']);
      const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      let raw=null;
      for(const w of P.w){try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.i)},wk,b64(w.k));break;}catch(x){}}
      if(!raw)throw new Error('no match');
      if(document.getElementById('r').checked)store('set',toB64(raw));else store('del');
      await openWith(raw);
    }catch(err){msg.textContent='Wrong password. Try again.';btn.disabled=false;btn.textContent='Open';}
  });
})();
</script>
